name: Vérification des photos Commons

# Les images ne sont pas hébergées dans le repo : une suppression sur Wikimedia
# casserait silencieusement une fiche. Voir CLAUDE.md §6.3.
on:
  schedule:
    - cron: "17 6 * * 1" # tous les lundis à 6h17 UTC
  push:
    paths:
      - "data/ministers.json"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: check
        run: npm run check-links

      - name: Ouvrir une issue si une photo a disparu
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Photo(s) Commons indisponible(s)';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'photos',
            });
            if (existing.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['photos'],
              body: [
                'La vérification hebdomadaire a échoué : au moins une photo n\'est plus servie par Wikimedia Commons.',
                '',
                `Détail dans le journal du workflow : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Corrigez `commonsFile` dans `data/ministers.json`, ou retirez la fiche concernée.',
              ].join('\n'),
            });
