name: CI

# Ces contrôles tournent sur chaque PR et sur `main`. Ils ne bloquent PAS le merge
# à eux seuls : il faut les déclarer « required » dans les règles de branche du
# dépôt. Voir la section « Contribuer » du README.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une nouvelle poussée sur une PR annule la vérification précédente, devenue inutile.
# Sur `main` on ne coupe rien : chaque commit doit garder son verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `--check` ne réécrit rien : il liste les fichiers mal formatés et sort en
      # erreur. `npm run format` corrige tout en local.
      - run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # La validation du schéma précède les tests : un JSON cassé rend les échecs
      # de tests illisibles, alors que le validateur pointe la ligne fautive.
      - name: Valider data/ministers.json
        run: npm run validate
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  # Point d'entrée unique à déclarer « required » : il suffit d'exiger ce job pour
  # exiger tous les autres. Ajouter un contrôle à la CI ne demande alors qu'à
  # l'ajouter à `needs`, sans retoucher la configuration du dépôt.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test, build]
    if: always()
    steps:
      - name: Vérifier qu'aucun job n'a échoué
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Au moins un contrôle a échoué."
            exit 1
          fi
          echo "Tous les contrôles sont passés."
